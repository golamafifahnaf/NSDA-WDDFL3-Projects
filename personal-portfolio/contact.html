                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Phone</label>

                    <div class="mb-3">

                    <div class="mb-3">

                        <textarea id="msg" class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                    </div>
                    <div class="text-end"><button id="submit" class="btn btn-primary" type="submit">Send Message</button></div>
